# Pull-request check: the reactor must build and flatten cleanly with a CI-style version, the pins must
# land in what a service resolves, and the resolved set must pass the OSV gate.
# Nothing is published from here; publishing happens only from main (publish.yml).
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Repeated versions agree between platform-parent and platform-dependencies
        run: scripts/check-synced-properties.sh

      - name: Build and install with a throwaway revision
        run: mvn -B -Drevision=0.0.0-PR clean install

      - name: Prove the installed POMs carry literals, not expressions
        run: |
          set -euo pipefail
          BASE="$HOME/.m2/repository/io/github/bicikletka"
          for artifact in platform-bom platform-dependencies platform-parent; do
            POM="$BASE/$artifact/0.0.0-PR/$artifact-0.0.0-PR.pom"
            test -f "$POM"
            if grep -q '\${revision}' "$POM"; then
              echo "::error::flatten did not resolve \${revision} in the installed $artifact POM"; exit 1
            fi
          done
          PARENT="$BASE/platform-parent/0.0.0-PR/platform-parent-0.0.0-PR.pom"
          grep -q '<parameters>true</parameters>' "$PARENT"
          grep -q '<pluginManagement>' "$PARENT"
          grep -c '<version>0.0.0-PR</version>' "$PARENT" | grep -qx 2   # own version + BOM import

      - name: Prove the pins land in what a service resolves
        run: scripts/check-resolved-versions.sh

  # Dependency gate. actions/dependency-review-action needs GitHub Advanced Security on private
  # repositories (not on the free plan this org is on), so the resolved runtime dependency set is scanned
  # with OSV-Scanner instead. Here that set is what ci/resolved-set resolves: a stand-in service that
  # inherits platform-parent and declares, without versions, the libraries the services ship. The CycloneDX
  # SBOM lists exactly what would end up in an app.jar, osv-scanner matches it against the OSV database,
  # and .github/scripts/osv_severity_gate.py fails the job on any High/Critical (CVSS >= 7.0 or unknown
  # severity) finding that is not in osv-scanner.toml. The allowlist needs a reason and an ignoreUntil date
  # at most 90 days out. Runs for Dependabot PRs too: those bumps are exactly what this should check.
  dependency-scan:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the reactor
        run: mvn -B -q -Drevision=0.0.0-PR install
      - name: Resolve the runtime dependency set (CycloneDX SBOM)
        run: >
          mvn -B -q -Drevision=0.0.0-PR -f ci/resolved-set/pom.xml
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
      - name: Scan the SBOM
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        # The scanner exits non-zero on any finding, medium included; the gate below decides.
        continue-on-error: true
        with:
          scan-args: |-
            -L=ci/resolved-set/target/bom.json
            --config=osv-scanner.toml
            --format=json
            --output-file=osv-results.json
      - name: Gate on High/Critical findings and the allowlist
        run: |
          python3 .github/scripts/osv_severity_gate.py osv-results.json --config osv-scanner.toml \
            --sbom ci/resolved-set/target/bom.json --min-components 100
      - name: Gate script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
